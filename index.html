<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 백업</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
        }

        /* 상단 UI */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;

            padding: 16px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        .toolbar h1 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        button,
        input[type="file"],
        input[type="text"] {
            font: inherit;
        }

        .file-input-label {
            display: inline-flex;
            align-items: center;
            padding: 9px 14px;
            border-radius: 8px;
            background: #f0f0f2;
            color: #1c1c1e;
            cursor: pointer;
            font-size: 14px;
        }

        .file-input-label:hover {
            background: #e5e5ea;
        }

        #fileInput {
            display: none;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;

            background: #1c1c1e;
            color: #ffffff;
        }

        button:hover {
            opacity: 0.85;
        }

        .toolbar-hint {
            font-size: 12px;
            color: #8e8e93;
            margin-left: 4px;
        }

        /* 닉네임 설정 패널 */
        .nickname-panel {
            display: none;
            max-width: 900px;
            margin: 16px auto 0;
            padding: 0 16px;
        }

        .nickname-panel-inner {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px 16px;
        }

        .nickname-panel-title {
            margin: 0 0 12px;
            font-size: 14px;
            font-weight: 700;
            color: #1c1c1e;
        }

        .nickname-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .nickname-row:last-child {
            margin-bottom: 0;
        }

        .nickname-swatch {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nickname-swatch img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .nickname-label {
            flex: 0 1 150px;
            min-width: 90px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }

        .nickname-label:focus {
            border-color: #8aa8ff;
            box-shadow: 0 0 0 2px #eef4ff;
        }

        .nickname-row input[type="color"] {
            flex: 0 0 auto;
            width: 34px;
            height: 30px;
            padding: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        .nickname-row input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
        }

        /* 채팅 영역 */
        #chat {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* 메시지 */
        .chat-block {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 14px 0;
        }

        .chat-avatar {
            flex: 0 0 40px;

            width: 40px;
            height: 40px;

            /* 카카오톡식 인장: 정사각형 + 둥근 모서리 */
            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: #ffffff;
            font-weight: 700;
            font-size: 17px;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;
        }

        .chat-body {
            min-width: 0;
            max-width: calc(100% - 50px);
        }

        .chat-meta {
            display: flex;
            align-items: baseline;
            gap: 8px;

            margin: 0 0 4px 2px;
        }

        .chat-name {
            font-weight: 700;
            font-size: 14px;
        }

        .chat-time {
            color: #8e8e93;
            font-size: 12px;
        }

        .chat-msg-row {
            display: flex;
        }

        .chat-msg-row + .chat-msg-row {
            margin-top: 4px;
        }

        .chat-msg {
            white-space: pre-wrap;
            overflow-wrap: anywhere;

            background: #ffffff;
            border: 1px solid #e5e5e7;

            border-radius: 4px 16px 16px 16px;

            padding: 10px 13px;

            line-height: 1.5;
            font-size: 15px;

            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);

            cursor: text;
        }

        /* 직접 수정 가능한 말풍선 표시 */
        .chat-msg[contenteditable] {
            outline: none;
        }

        .chat-msg[contenteditable]:hover {
            box-shadow: 0 0 0 1px #9db4ff inset;
        }

        .chat-msg[contenteditable]:focus {
            box-shadow: 0 0 0 2px #2563eb inset;
            background: #eef4ff;
        }

        /* 구분선 */
        .chat-divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 28px 0;
        }

        .chat-divider::before,
        .chat-divider::after {
            content: "";

            height: 1px;

            background: #d1d1d6;

            flex: 1;
        }

        .chat-divider-badge {
            flex: 0 0 auto;

            padding: 5px 12px;

            border-radius: 999px;

            background: #e5e5ea;
            color: #636366;

            font-size: 12px;
            font-weight: 600;
        }

        /* 빈 화면 */
        .empty {
            text-align: center;
            color: #8e8e93;
            padding: 60px 20px;
        }

        /* 전체 TXT 텍스트 편집 */
        .raw-text-panel {
            display: block;
            max-width: 900px;
            margin: 16px auto 0;
            padding: 0 16px;
        }

        .raw-text-panel-inner {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px 16px;
        }

        .raw-text-panel-title {
            margin: 0 0 6px;
            font-size: 14px;
            font-weight: 700;
            color: #1c1c1e;
        }

        .raw-text-panel-help {
            margin: 0 0 10px;
            font-size: 12px;
            color: #8e8e93;
        }

        #rawTextInput {
            width: 100%;
            min-height: 280px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            background: #fafafa;
            color: #1c1c1e;
            font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        #rawTextInput:focus {
            border-color: #8aa8ff;
            box-shadow: 0 0 0 2px #eef4ff;
            background: #fff;
        }

        /* 편집 패널 공통 */
        .editor-panel {
            display: none;
            max-width: 900px;
            margin: 16px auto 0;
            padding: 0 16px;
        }

        .editor-panel-inner {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px 16px;
        }

        .editor-panel-title {
            margin: 0 0 12px;
            font-size: 14px;
            font-weight: 700;
            color: #1c1c1e;
        }

        .stamp-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 12px;
        }

        .stamp-col {
            min-width: 0;
        }

        .library-section-title {
            margin: 0 0 6px;
            font-size: 13px;
            font-weight: 700;
            color: #3a3a3c;
        }

        .icon-library-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px;
        }

        .icon-library-tools input[type="text"] {
            flex: 1 1 260px;
            min-width: 180px;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
        }

        .icon-target-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #636366;
        }

        .icon-target-row select {
            min-width: 140px;
            padding: 7px 9px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            font: inherit;
            font-size: 12px;
        }

        .icon-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .icon-empty {
            grid-column: 1 / -1;
            padding: 20px;
            text-align: center;
            color: #8e8e93;
            font-size: 12px;
            border: 1px dashed #d1d1d6;
            border-radius: 8px;
        }

        .icon-card {
            position: relative;
            min-width: 0;
            padding: 10px 8px 8px;
            border: 1px solid #e5e5e7;
            border-radius: 10px;
            background: #fafafa;
            text-align: center;
        }

        .icon-card img {
            width: 52px;
            height: 52px;
            display: block;
            margin: 0 auto 7px;
            object-fit: cover;
            border-radius: 9px;
        }

        .color-card-swatch {
            width: 52px;
            height: 52px;
            margin: 0 auto 7px;
            border-radius: 9px;
            border: 1px solid rgba(0,0,0,0.08);
        }

        .icon-card-name {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 7px;
            font-size: 11px;
            color: #636366;
        }

        .icon-card-actions {
            display: flex;
            gap: 4px;
        }

        .icon-card-actions button {
            flex: 1;
            min-width: 0;
            padding: 6px 5px;
            border-radius: 6px;
            font-size: 11px;
        }

        .icon-card-actions .delete-icon {
            background: #e5e5ea;
            color: #636366;
        }

        /* 오류 배너 */
        .error-banner {
            max-width: 900px;
            margin: 16px auto 0;
            padding: 12px 16px;

            background: #fdecea;
            border: 1px solid #f5c2bd;
            border-radius: 8px;

            color: #b3261e;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            #chat {
                padding: 18px 10px 40px;
            }

            .chat-body {
                max-width: calc(100% - 50px);
            }

            .nickname-label {
                flex: 1 1 100px;
                min-width: 80px;
            }

            .stamp-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- 상단 UI -->
    <div class="toolbar">
        <h1>채팅 백업</h1>

        <div class="toolbar-actions">
            <label class="file-input-label" for="fileInput">TXT 파일 불러오기 (선택)</label>
            <input
                id="fileInput"
                type="file"
                accept=".txt,text/plain"
            >

            <button id="copyButton">
                HTML 복사
            </button>

            <button id="toggleStampPanelButton" type="button">
                인장 · 색상 보관함
            </button>

            <span class="toolbar-hint">
                말풍선을 클릭하면 내용을 바로 수정할 수 있어요.
            </span>
        </div>
    </div>


    <!-- 전체 TXT 텍스트 편집 -->
    <div id="rawTextPanel" class="raw-text-panel">
        <div class="raw-text-panel-inner">
            <p class="raw-text-panel-title">전체 TXT 텍스트 입력 / 편집</p>
            <p class="raw-text-panel-help">TXT 파일을 첨부하지 않아도 됩니다. 아래 칸에 채팅 원문을 그대로 붙여넣으면 입력 즉시 아래 채팅 화면에 반영됩니다. 말풍선을 직접 수정한 내용도 이곳에 반영됩니다.</p>
            <textarea id="rawTextInput" spellcheck="false" wrap="off" placeholder="예:
[과과] [오후 10:33] ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ
[과과] [오후 10:33] 그간 수상하게 붙어다녔는데
[과과] [오후 10:33] 납득하지 않을까

/~ 뫄뫄, 솨솨 인생에 개입 (정설) ~/

[놔놔] [오후 10:33] 뫄뫄가 개인적으로 본인 삶의 권태를 표현할 일이 있을까..."></textarea>
        </div>
    </div>


    <!-- 닉네임별 인장 설정 -->
    <div id="nicknamePanel" class="nickname-panel">
        <div class="nickname-panel-inner">
            <p class="nickname-panel-title">닉네임별 인장 설정 (색상 / 이미지)</p>
            <div id="nicknameRows"></div>
        </div>
    </div>


    <!-- 자주 사용하는 인장 아이콘 보관함 -->
    <!-- 인장 아이콘 · 색상 보관함 (하나의 버튼으로 함께 관리) -->
    <div id="stampLibraryPanel" class="editor-panel">
        <div class="editor-panel-inner">
            <p class="editor-panel-title">인장 · 색상 보관함</p>

            <div class="stamp-columns">
                <div class="stamp-col">
                    <p class="library-section-title">색상</p>
                    <div class="icon-library-tools">
                        <input id="colorHexInput" type="text" placeholder="#a8323a 형태로 붙여넣기">
                        <button id="addColorButton" type="button">등록</button>
                    </div>
                </div>

                <div class="stamp-col">
                    <p class="library-section-title">아이콘</p>
                    <div class="icon-library-tools">
                        <input id="iconFileInput" type="file" accept="image/*">
                        <input id="iconUrlInput" type="text" placeholder="이미지 URL을 입력하세요">
                        <button id="addIconUrlButton" type="button">URL 등록</button>
                    </div>
                </div>
            </div>

            <div class="icon-target-row">
                <span>적용할 닉네임</span>
                <select id="stampTargetSelect">
                    <option value="">TXT를 먼저 불러오세요</option>
                </select>
            </div>

            <div id="stampList" class="icon-list"></div>
        </div>
    </div>


    <!-- 오류 발생 시 여기에 내용이 표시됩니다 -->
    <div id="errorBanner" class="error-banner" style="display:none;"></div>


    <!-- 실제 채팅 영역 -->
    <div id="chat">
        <div class="empty">
            TXT 파일을 선택하세요.
        </div>
    </div>


    <!-- ============================================================
         사용자 설정 (기본값)
         이름 추가/수정은 아래 목록만 고치면 됩니다.
         (예전엔 userConfig.js라는 별도 파일이었지만,
          로컬 PC에서 index.html을 직접 열었을 때 브라우저가
          다른 로컬 파일 불러오기를 보안상 막아버려서
          이 파일 안으로 직접 옮겼습니다)
         ============================================================ -->
    <script>
        const userConfig = {

            "Popo": {
                avatar: "P",
                color: "#1c1c1e",
                image: ""
            },

            "Kong": {
                avatar: "K",
                color: "#a8323a",
                image: ""
            },

        };
    </script>


    <script>

        const fileInput = document.getElementById("fileInput");
        const chat = document.getElementById("chat");
        const copyButton = document.getElementById("copyButton");

        const rawTextPanel = document.getElementById("rawTextPanel");
        const rawTextInput = document.getElementById("rawTextInput");

        const nicknamePanel = document.getElementById("nicknamePanel");
        const nicknameRows = document.getElementById("nicknameRows");

        const toggleStampPanelButton = document.getElementById("toggleStampPanelButton");
        const stampLibraryPanel = document.getElementById("stampLibraryPanel");

        const iconFileInput = document.getElementById("iconFileInput");
        const iconUrlInput = document.getElementById("iconUrlInput");
        const addIconUrlButton = document.getElementById("addIconUrlButton");

        const colorHexInput = document.getElementById("colorHexInput");
        const addColorButton = document.getElementById("addColorButton");

        const stampTargetSelect = document.getElementById("stampTargetSelect");
        const stampList = document.getElementById("stampList");

        const errorBanner = document.getElementById("errorBanner");


        /*
         * 오류가 나면 콘솔뿐 아니라 화면에도 바로 보이게 표시.
         * (개발자도구를 열지 않아도 원인을 바로 알 수 있도록)
         */
        function showError(prefix, err) {
            const message =
                (err && err.message) ? err.message : String(err);

            errorBanner.textContent =
                "⚠ " + prefix + ": " + message;

            errorBanner.style.display = "block";

            console.error(prefix, err);
        }

        window.addEventListener("error", function (e) {
            showError("스크립트 오류", e.error || e.message);
        });

        window.addEventListener("unhandledrejection", function (e) {
            showError("처리되지 않은 오류", e.reason);
        });


        let parsedMessages = [];

        /*
         * 닉네임별 색상/이미지 "실시간 수정값"
         * userConfig.js 값을 기본값으로 시작하고,
         * 패널에서 바꾸면 이 객체가 갱신된다.
         */
        const userOverrides = {};


        /*
         * 사용자 설정 가져오기
         * 우선순위: 페이지에서 수정한 값(userOverrides) > userConfig.js > 기본값
         */
        function getUserConfig(nickname) {

            const base =
                (typeof userConfig !== "undefined" &&
                 userConfig &&
                 userConfig[nickname]) || null;

            const override =
                userOverrides[nickname] || null;

            return {
                avatar:
                    (base && base.avatar) ||
                    nickname.charAt(0) ||
                    "?",

                color:
                    (override && override.color) ||
                    (base && base.color) ||
                    "#1c1c1e",

                image:
                    override
                        ? override.image
                        : ((base && base.image) || "")
            };
        }



        /*
         * TXT 파싱
         *
         * 예:
         *
         * [닉네임] [오전 1:39] 내용
         * 다음 줄
         * 다음 줄
         *
         * [닉네임2] [오후 2:30] 내용
         *
         * /~test~/
         */
        function parseChat(text) {

            const lines =
                text
                    .replace(/^\uFEFF/, "")
                    .split(/\r?\n/);


            const messagePattern =
                /^\[([^\]]+)\]\s+\[(오전|오후)\s+(\d{1,2}:\d{2})\]\s?(.*)$/;


            const separatorPattern =
                /^\/~\s*(.*?)\s*~\/$/;


            /*
             * 카카오톡 PC 내보내기의 날짜 구분선
             *
             * --------------- 2026년 8월 26일 수요일 ---------------
             *
             * 양쪽에 대시(-)가 3개 이상 있으면 구분선으로 인식
             */
            const dashSeparatorPattern =
                /^-{3,}\s*(.+?)\s*-{3,}$/;


            /*
             * 위 두 패턴 중 하나라도 맞으면
             * 구분선 텍스트를 돌려주고,
             * 아니면 null
             */
            function matchSeparator(line) {

                const tildeMatch =
                    line.match(separatorPattern);

                if (tildeMatch) {
                    return tildeMatch[1];
                }

                const dashMatch =
                    line.match(dashSeparatorPattern);

                if (dashMatch) {
                    return dashMatch[1];
                }

                return null;
            }


            const result = [];

            let current = null;


            for (const line of lines) {


                /*
                 * 구분선
                 *
                 * /~test~/
                 * --- 2026년 8월 26일 수요일 ---
                 */
                const separatorContent =
                    matchSeparator(line);


                if (separatorContent !== null) {

                    /*
                     * 기존 메시지 저장
                     */
                    if (current) {

                        current.content =
                            current.content
                                .join("\n")
                                .trimEnd();

                        result.push(current);

                        current = null;
                    }


                    /*
                     * 구분선은 메시지가 아닌 별도 객체
                     */
                    result.push({
                        type: "separator",
                        content: separatorContent
                    });

                    continue;
                }



                /*
                 * 메시지 헤더
                 */
                const messageMatch =
                    line.match(messagePattern);


                if (messageMatch) {

                    /*
                     * 이전 메시지 저장
                     */
                    if (current) {

                        current.content =
                            current.content
                                .join("\n")
                                .trimEnd();

                        result.push(current);
                    }


                    /*
                     * 새로운 메시지 시작
                     */
                    current = {

                        type: "message",

                        nickname:
                            messageMatch[1],

                        time:
                            `${messageMatch[2]} ${messageMatch[3]}`,

                        content:
                            [messageMatch[4]]
                    };


                    continue;
                }


                /*
                 * 메시지의 추가 줄
                 */
                if (current) {

                    current.content.push(line);
                }
            }



            /*
             * 마지막 메시지 저장
             */
            if (current) {

                current.content =
                    current.content
                        .join("\n")
                        .trimEnd();

                result.push(current);
            }


            return result;
        }



        /*
         * 현재 parsedMessages를 TXT 원문 형태로 다시 만들어
         * 전체 텍스트 편집창에 반영한다.
         */
        function serializeChat(messages) {
            return messages.map(function (item) {
                if (item.type === "separator") {
                    return "/~" + item.content + "~/";
                }

                const content = String(item.content || "");
                const lines = content.split("\n");
                const firstLine = "[" + item.nickname + "] [" + item.time + "] " + (lines.shift() || "");
                return [firstLine].concat(lines).join("\n");
            }).join("\n");
        }

        function syncRawTextFromMessages() {
            if (rawTextInput) {
                rawTextInput.value = serializeChat(parsedMessages);
            }
        }

        /*
         * 닉네임 변경: 같은 닉네임을 가진 모든 메시지에 즉시 반영하고
         * 기존 색상/이미지 설정도 새 닉네임으로 이동한다.
         */
        function renameNickname(oldNickname, requestedName) {
            const newNickname = String(requestedName || "").trim();

            if (!newNickname || newNickname === oldNickname) {
                return false;
            }

            if (userOverrides[newNickname] && newNickname !== oldNickname) {
                alert("이미 사용 중인 닉네임입니다. 다른 이름을 입력해주세요.");
                buildNicknamePanel(parsedMessages);
                return false;
            }

            const config = userOverrides[oldNickname] || {
                color: "#1c1c1e",
                image: ""
            };

            delete userOverrides[oldNickname];
            userOverrides[newNickname] = config;

            parsedMessages.forEach(function (item) {
                if (item.type === "message" && item.nickname === oldNickname) {
                    item.nickname = newNickname;
                }
            });

            syncRawTextFromMessages();
            renderChat(parsedMessages);
            buildNicknamePanel(parsedMessages);
            updateStampTargetSelect();
            stampTargetSelect.value = newNickname;
            return true;
        }


        /*
         * 파싱 결과에서 등장하는 닉네임을
         * 처음 나온 순서대로 모아 패널을 구성한다.
         */
        function buildNicknamePanel(messages) {

            const seen = new Set();
            const order = [];

            messages.forEach(function (item) {

                if (item.type === "message" && !seen.has(item.nickname)) {
                    seen.add(item.nickname);
                    order.push(item.nickname);
                }
            });


            /*
             * 현재 TXT에 존재하지 않는 닉네임의 임시 설정은 정리한다.
             * (전체 텍스트를 수정해 닉네임/메시지를 삭제했을 때 반영)
             */
            Object.keys(userOverrides).forEach(function (nickname) {
                if (!order.includes(nickname)) {
                    delete userOverrides[nickname];
                }
            });

            /*
             * 처음 보는 닉네임이면
             * userConfig.js 값을 기본값으로 override 초기화
             */
            order.forEach(function (nickname) {

                if (userOverrides[nickname]) {
                    return;
                }

                const base =
                    (typeof userConfig !== "undefined" &&
                     userConfig &&
                     userConfig[nickname]) || null;

                userOverrides[nickname] = {
                    color: (base && base.color) || "#1c1c1e",
                    image: (base && base.image) || ""
                };
            });


            nicknameRows.innerHTML = "";

            if (!order.length) {
                nicknamePanel.style.display = "none";
                return;
            }

            order.forEach(function (nickname) {

                const config = userOverrides[nickname];

                const row =
                    document.createElement("div");
                row.className = "nickname-row";


                /*
                 * 미리보기 스와치
                 */
                const swatch =
                    document.createElement("div");
                swatch.className = "nickname-swatch";
                swatch.style.background = config.color;

                function refreshSwatch() {
                    swatch.innerHTML = "";
                    if (config.image) {
                        const img = document.createElement("img");
                        img.src = config.image;
                        img.alt = "";
                        img.onerror = function () {
                            this.remove();
                        };
                        swatch.appendChild(img);
                    }
                    swatch.style.background = config.color;
                }
                refreshSwatch();


                /*
                 * 닉네임 라벨
                 */
                const label =
                    document.createElement("input");
                label.className = "nickname-label";
                label.type = "text";
                label.value = nickname;
                label.title = nickname;
                label.spellcheck = false;

                label.addEventListener("change", function () {
                    renameNickname(nickname, this.value);
                });

                label.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        this.blur();
                    }
                });


                /*
                 * 색상 선택
                 */
                const colorInput =
                    document.createElement("input");
                colorInput.type = "color";
                colorInput.value = config.color;

                colorInput.addEventListener("input", function () {
                    config.color = this.value;
                    refreshSwatch();
                    renderChat(parsedMessages);
                });


                /*
                 * 이미지 URL 입력
                 */
                const imageInput =
                    document.createElement("input");
                imageInput.type = "text";
                imageInput.placeholder = "이미지 URL (선택)";
                imageInput.value = config.image;

                imageInput.addEventListener("change", function () {
                    config.image = this.value.trim();
                    refreshSwatch();
                    renderChat(parsedMessages);
                });


                row.appendChild(swatch);
                row.appendChild(label);
                row.appendChild(colorInput);
                row.appendChild(imageInput);

                nicknameRows.appendChild(row);
            });

            nicknamePanel.style.display = "block";
            updateStampTargetSelect();
        }



        /*
         * 자주 사용하는 인장 아이콘 보관함
         */
        const ICON_STORAGE_KEY = "chatBackupStampIcons_v1";

        function loadSavedIcons() {
            try {

        function updateStampTargetSelect() {

        function applySavedIcon(src) {
            const nickname = stampTargetSelect.value;

            if (!nickname || !userOverrides[nickname]) {
                alert("먼저 적용할 닉네임을 선택해주세요.");

            userOverrides[nickname].image = src;

        function renderStampLibrary() {
            stampList.innerHTML = "";

            if (!savedIcons.length && !savedColors.length) {
                const empty = document.createElement("div");
                empty.className = "icon-empty";
                empty.textContent = "등록된 항목이 없습니다. 위에서 이미지나 URL, 색상을 등록해주세요.";

                card.appendChild(name);

            });

            savedColors.forEach(function (color) {
                const card = document.createElement("div");

                const swatch = document.createElement("div");
                swatch.className = "color-card-swatch";

                const name = document.createElement("span");
                name.className = "icon-card-name";
                name.textContent = color.hex;
                name.title = color.hex;

                const actions = document.createElement("div");
                actions.className = "icon-card-actions";

                const useButton = document.createElement("button");
                useButton.type = "button";
                useButton.textContent = "적용";
                useButton.addEventListener("click", function () {
                    applySavedColor(color.hex);
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-icon";
                deleteButton.textContent = "삭제";
                deleteButton.addEventListener("click", function () {
                    savedColors = savedColors.filter(function (saved) {
                        return saved.id !== color.id;
                    });
                    saveColors();
                    renderStampLibrary();
                });

                actions.appendChild(useButton);
                actions.appendChild(deleteButton);
                card.appendChild(swatch);
                card.appendChild(name);
                card.appendChild(actions);
                stampList.appendChild(card);
            });
        }

        function registerIcon(src, name) {
            const trimmed = String(src || "").trim();
            if (!trimmed) {
                return;
            }

            savedIcons.push({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2),
                src: trimmed,
                name: name || "인장 " + (savedIcons.length + 1)
            });

            saveIcons();
            renderStampLibrary();
        }

        iconFileInput.addEventListener("change", function () {
            const file = this.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = function (event) {

                iconFileInput.value = "";

            iconUrlInput.value = "";
        });


        /*
         * 자주 사용하는 색상 보관함
         * (인장 아이콘 보관함과 동일한 구조)
         */
        const COLOR_STORAGE_KEY = "chatBackupStampColors_v1";

        function loadSavedColors() {
            try {
                const raw = localStorage.getItem(COLOR_STORAGE_KEY);
                const data = raw ? JSON.parse(raw) : [];
                return Array.isArray(data) ? data : [];
            } catch (err) {
                console.warn("색상 목록을 불러오지 못했습니다.", err);
                return [];
            }
        }

        let savedColors = loadSavedColors();

        function saveColors() {
            try {
                localStorage.setItem(COLOR_STORAGE_KEY, JSON.stringify(savedColors));
            } catch (err) {
                showError("색상 저장 중 오류", err);
            }
        }

        /*
         * 헥사코드 정규화
         * - "#" 없이 입력해도 자동으로 붙여준다
         * - #abc 같은 3자리 축약형은 #aabbcc로 풀어준다
         * - 형식이 잘못됐으면 null
         */
        function normalizeHex(rawValue) {
            let v = String(rawValue || "").trim();

            if (!v) {
                return null;
            }

            if (v[0] !== "#") {
                v = "#" + v;
            }

            const shortMatch = /^#([0-9a-fA-F]{3})$/.exec(v);
            if (shortMatch) {
                const c = shortMatch[1];
                v = "#" + c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
            }

            if (!/^#[0-9a-fA-F]{6}$/.test(v)) {
                return null;
            }

            return v.toLowerCase();
        }

        function applySavedColor(hex) {
            const nickname = stampTargetSelect.value;

            if (!nickname || !userOverrides[nickname]) {
                alert("먼저 적용할 닉네임을 선택해주세요.");
                return;
            }

            userOverrides[nickname].color = hex;
            buildNicknamePanel(parsedMessages);
            renderChat(parsedMessages);
            updateStampTargetSelect();
            stampTargetSelect.value = nickname;
        }



        function registerColor(hexRaw) {
            const hex = normalizeHex(hexRaw);

            if (!hex) {
                return null;
            }

            const existing = savedColors.find(function (saved) {
                return saved.hex === hex;
            });

            if (existing) {
                return hex;
            }

            savedColors.push({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2),
                hex: hex
            });

            saveColors();
            renderStampLibrary();

            return hex;
        }

        addColorButton.addEventListener("click", function () {
            const hex = registerColor(colorHexInput.value);

            if (!hex) {
                alert("올바른 헥사코드를 입력해주세요. (예: a8323a 또는 #a8323a)");
                return;
            }

            colorHexInput.value = "";
        });

        colorHexInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                addColorButton.click();
            }
        });

        toggleStampPanelButton.addEventListener("click", function () {

            stampLibraryPanel.style.display = isHidden ? "block" : "none";

            if (isHidden) {
                renderStampLibrary();
                updateStampTargetSelect();
            }
        });

        renderStampLibrary();
        updateStampTargetSelect();


        /*
         * 채팅 렌더링
         */
        function renderChat(messages) {

            chat.innerHTML = "";


            if (!messages.length) {

                const empty =
                    document.createElement("div");

                empty.className = "empty";

                empty.textContent =
                    "표시할 채팅이 없습니다.";

                chat.appendChild(empty);

                return;
            }


            /*
             * 직전에 렌더링된 "사람 블록" 정보를 기억해두었다가
             * 같은 닉네임이 연속되면 인장(아바타)/이름/시간을
             * 생략하고 메시지만 아래로 이어 붙인다.
             */
            let currentBlock = null;

            for (let i = 0; i < messages.length; i++) {

                const item = messages[i];


                /*
                 * 구분선
                 */
                if (item.type === "separator") {

                    const divider =
                        document.createElement("div");

                    divider.className =
                        "chat-divider";


                    const badge =
                        document.createElement("span");

                    badge.className =
                        "chat-divider-badge";

                    badge.textContent =
                        item.content;
                    badge.dataset.separatorIdx = String(i);


                    divider.appendChild(badge);

                    chat.appendChild(divider);


                    /*
                     * 구분선 다음엔 항상
                     * 새 블록으로 시작
                     */
                    currentBlock = null;

                    continue;
                }



                /*
                 * 같은 사람이 연속으로 말한 경우
                 * → 새 블록을 만들지 않고
                 *    기존 블록의 body에 메시지만 추가
                 */
                if (
                    currentBlock &&
                    currentBlock.nickname === item.nickname
                ) {

                    const row =
                        document.createElement("div");

                    row.className =
                        "chat-msg-row";


                    const msg =
                        document.createElement("div");

                    msg.className =
                        "chat-msg";

                    msg.textContent =
                        item.content;

                    msg.setAttribute("contenteditable", "plaintext-only");
                    msg.setAttribute("spellcheck", "false");
                    msg.dataset.idx = String(i);


                    row.appendChild(msg);

                    currentBlock.body.appendChild(row);

                    continue;
                }



                /*
                 * 사용자 설정
                 */
                const config =
                    getUserConfig(item.nickname);



                /*
                 * chat-block
                 */
                const block =
                    document.createElement("div");

                block.className =
                    "chat-block";



                /*
                 * 아바타
                 */
                const avatar =
                    document.createElement("div");

                avatar.className =
                    "chat-avatar";

                avatar.style.background =
                    config.color;



                /*
                 * 이미지 아바타
                 */
                if (config.image) {

                    const img =
                        document.createElement("img");

                    img.src =
                        config.image;

                    img.alt = "";


                    /*
                     * 이미지 로딩 실패 시
                     * 설정된 글자로 대체
                     */
                    img.onerror = function () {

                        this.remove();

                        avatar.textContent =
                            config.avatar;
                    };


                    avatar.appendChild(img);

                }

                /*
                 * 문자 아바타
                 */
                else {

                    avatar.textContent =
                        config.avatar;
                }



                /*
                 * chat-body
                 */
                const body =
                    document.createElement("div");

                body.className =
                    "chat-body";



                /*
                 * chat-meta
                 */
                const meta =
                    document.createElement("div");

                meta.className =
                    "chat-meta";



                /*
                 * 이름
                 */
                const name =
                    document.createElement("span");

                name.className =
                    "chat-name";

                name.textContent =
                    item.nickname;



                /*
                 * 시간
                 */
                const time =
                    document.createElement("span");

                time.className =
                    "chat-time";

                time.textContent =
                    item.time;



                meta.appendChild(name);
                meta.appendChild(time);



                /*
                 * chat-msg-row
                 */
                const row =
                    document.createElement("div");

                row.className =
                    "chat-msg-row";



                /*
                 * 메시지 (클릭해서 바로 수정 가능)
                 */
                const msg =
                    document.createElement("div");

                msg.className =
                    "chat-msg";

                msg.textContent =
                    item.content;

                msg.setAttribute("contenteditable", "plaintext-only");
                msg.setAttribute("spellcheck", "false");
                msg.dataset.idx = String(i);



                row.appendChild(msg);

                body.appendChild(meta);
                body.appendChild(row);


                block.appendChild(avatar);
                block.appendChild(body);


                chat.appendChild(block);


                /*
                 * 이 블록을 "직전 블록"으로 기억
                 */
                currentBlock = {
                    nickname: item.nickname,
                    body: body
                };
            }
        }



        /*
         * 말풍선 직접 수정 → parsedMessages에 반영
         * (닉네임 설정을 바꿔 다시 렌더링해도
         *  수정한 내용이 사라지지 않도록 하기 위함)
         */
        chat.addEventListener("input", function (e) {

            const target = e.target;

            if (!target.classList || !target.classList.contains("chat-msg")) {
                return;
            }

            const idx = Number(target.dataset.idx);

            if (Number.isNaN(idx) || !parsedMessages[idx]) {
                return;
            }

            parsedMessages[idx].content = target.textContent;
            syncRawTextFromMessages();
        });


        /*
         * 전체 TXT 텍스트 편집창 → 파싱 → 화면에 즉시 반영
         */
        rawTextInput.addEventListener("input", function () {
            try {
                parsedMessages = parseChat(this.value);
                buildNicknamePanel(parsedMessages);
                renderChat(parsedMessages);
                updateStampTargetSelect();
                errorBanner.style.display = "none";
            } catch (err) {
                showError("텍스트 처리 중 오류", err);
            }
        });



        /*
         * TXT 파일 선택
         */
        fileInput.addEventListener(
            "change",
            async function () {

                errorBanner.style.display = "none";

                const file =
                    this.files[0];

                if (!file) {
                    return;
                }

                try {

                    const text =
                        await file.text();


                    parsedMessages =
                        parseChat(text);

                    rawTextInput.value = text;
                    rawTextPanel.style.display = "block";
                    buildNicknamePanel(parsedMessages);
                    updateStampTargetSelect();
                    renderChat(parsedMessages);

                } catch (err) {

                    showError("파일 처리 중 오류", err);
                }
            }
        );



        /*
         * 현재 화면에 표시된 채팅 내용을
         * (수정 중 표시 등은 제거하고) HTML 문자열로 정리
         */
        function buildCleanHtml() {

            const clone = chat.cloneNode(true);

            clone.querySelectorAll("[contenteditable]").forEach(function (el) {
                el.removeAttribute("contenteditable");
                el.removeAttribute("spellcheck");
                el.removeAttribute("data-idx");
            });

            const emptyEl = clone.querySelector(".empty");
            if (emptyEl) {
                emptyEl.remove();
            }

            return '<div class="chat-backup">\n' +
                   clone.innerHTML.trim() +
                   '\n</div>';
        }



        /*
         * 클립보드 복사 (구형 브라우저 대비 fallback 포함)
         */
        function copyTextToClipboard(text) {

            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }

            return new Promise(function (resolve, reject) {

                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";

                document.body.appendChild(ta);
                ta.focus();
                ta.select();

                try {
                    document.execCommand("copy");
                    resolve();
                } catch (err) {
                    reject(err);
                } finally {
                    document.body.removeChild(ta);
                }
            });
        }



        /*
         * HTML 복사 버튼
         */
        copyButton.addEventListener("click", function () {

            const html = buildCleanHtml();

            if (!html) {
                return;
            }

            copyTextToClipboard(html)
                .then(function () {

                    const original = copyButton.textContent;
                    copyButton.textContent = "복사됨!";

                    setTimeout(function () {
                        copyButton.textContent = original;
                    }, 1500);
                })
                .catch(function () {
                    alert("복사에 실패했습니다. 브라우저 권한을 확인해주세요.");
                });
        });

    </script>
